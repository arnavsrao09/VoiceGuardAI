# Asterisk Configuration for VoiceGuardAI
# PJSIP Transport & Endpoint Configuration

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

; -------------------------------------------------------------
; Softphone / SIP Trunk Endpoint: 1001 (Demo Caller / Bank Agent)
; -------------------------------------------------------------
[1001]
type=endpoint
context=voiceguard-inbound
disallow=all
allow=ulaw
allow=alaw
allow=slin16
auth=auth1001
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[auth1001]
type=auth
auth_type=userpass
password=voiceguard_secret_pass
username=1001

[1001]
type=aor
max_contacts=5
remove_existing=yes

; -------------------------------------------------------------
; External Carrier / SIP Trunk Endpoint (e.g., Twilio, Plivo, Telnyx)
; -------------------------------------------------------------
[carrier-trunk]
type=endpoint
context=voiceguard-inbound
disallow=all
allow=ulaw
allow=alaw
allow=slin16
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
