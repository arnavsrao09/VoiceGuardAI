; Asterisk Dialplan for VoiceGuardAI Live Biometric & Deepfake Surveillance
[general]
static=yes
writeprotect=no
clearglobalvars=no

[voiceguard-inbound]
; Route any incoming phone call directly to Stasis ARI application
exten => _X.,1,NoOp(==> VoiceGuardAI Inbound Call from: ${CALLERID(num)} [Name: ${CALLERID(name)}] to ${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=voiceguard-hangup,s,1)
 same => n,Answer()
 same => n,Wait(0.2)
 same => n,NoOp(==> Dispatching to Asterisk REST Interface Stasis App: voiceguard_app)
 same => n,Stasis(voiceguard_app,${CALLERID(num)},${EXTEN})
 same => n,Hangup()

; Fallback for alphanumeric extensions or anonymous callers
exten => s,1,NoOp(==> VoiceGuardAI Inbound Default Route)
 same => n,Answer()
 same => n,Stasis(voiceguard_app,${CALLERID(num)},s)
 same => n,Hangup()

[voiceguard-hangup]
exten => s,1,NoOp(==> VoiceGuardAI Call Ended: ${CALLERID(num)})
 same => n,Return()
